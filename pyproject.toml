[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "disaster-triage-env"
version = "1.0.0"
description = "OpenEnv disaster triage environment for RL agent training"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Debanik Das" }]
requires-python = ">=3.11"
dependencies = [
    "openenv-core>=0.2.0",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.6",
    "pydantic==2.9.2",
    "numpy==1.26.4",
    "httpx==0.27.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "ruff",
    "mypy",
]

[project.scripts]
server = "server.app:main"
baseline = "inference.baseline_agent:run_baseline_all_tasks"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
