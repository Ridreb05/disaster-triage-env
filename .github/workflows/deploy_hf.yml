name: Deploy to Hugging Face Spaces

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate before deploy
        run: |
          python -m pip install -U pip
          python -m pip install -r requirements.txt
          pytest tests/test_openenv_compliance.py -v --tb=short

      - name: Push to Hugging Face Spaces
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "ci@disaster-triage-env"
          git config --global user.name "CI Deploy"
          git remote add hf https://USER:${HF_TOKEN}@huggingface.co/spaces/ridreb05/disaster-triage-env
          git push hf main --force
